<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .responsive-rates-grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-auto-rows: 1fr;
    }
    @media (min-width: 768px) {
      .responsive-rates-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-flow: column;
        grid-template-rows: repeat(var(--max-items), minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="h-screen w-full bg-gray-100 p-4 flex flex-col">
    <div class="flex-1 responsive-rates-grid gap-2" style="--max-items: 4;">
      <div class="bg-yellow-400">G1</div>
      <div class="bg-yellow-400">G2</div>
      <div class="bg-yellow-400">G3</div>
      <div class="bg-yellow-400">G4</div>
      <div class="bg-gray-400">S1</div>
      <div class="bg-gray-400">S2</div>
    </div>
  </div>
</body>
</html>
