name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          build-root-directory: android-app

      - name: Ensure Android App Icons
        run: |
          if [ ! -f "android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            SRC=""
            for p in "public/appstore.png" "devijewellers_display-main/public/appstore.png" "public/icon.png" "appstore.png"; do
              if [ -f "$p" ]; then SRC="$p"; break; fi
            done

            if [ -n "$SRC" ]; then
              mkdir -p "android-app/app/src/main/res/drawable"
              cp "$SRC" "android-app/app/src/main/res/drawable/ic_launcher_foreground.png"

              for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
                mkdir -p "android-app/app/src/main/res/mipmap-$d"
                cp "$SRC" "android-app/app/src/main/res/mipmap-$d/ic_launcher.png"
                cp "$SRC" "android-app/app/src/main/res/mipmap-$d/ic_launcher_round.png"
              done

              mkdir -p "android-app/app/src/main/res/values"
              echo '<resources><color name="ic_launcher_background">#B82541</color></resources>' > "android-app/app/src/main/res/values/colors.xml"

              mkdir -p "android-app/app/src/main/res/mipmap-anydpi-v26"
              echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>' > "android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
              cp "android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" "android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
            fi
          fi

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviJewellers-Signage-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
