name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          build-root-directory: android-app

      - name: Ensure Android App Icons
        run: |
          if [ ! -f "android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png" ]; then
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              density="${d%%:*}"
              size="${d##*:}"
              mkdir -p "android-app/app/src/main/res/mipmap-$density"
              convert public/appstore.png -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "android-app/app/src/main/res/mipmap-$density/ic_launcher.png"
              convert public/appstore.png -resize "${size}x${size}^" -gravity center -extent "${size}x${size}" "android-app/app/src/main/res/mipmap-$density/ic_launcher_round.png"
            done
            mkdir -p "android-app/app/src/main/res/values"
            echo '<resources><color name="ic_launcher_background">#B82541</color></resources>' > "android-app/app/src/main/res/values/colors.xml"
            mkdir -p "android-app/app/src/main/res/mipmap-anydpi-v26"
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher"/></adaptive-icon>' > "android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
            cp "android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" "android-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"
          fi

      - name: Build Debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviJewellers-Signage-APK
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
