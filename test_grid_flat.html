<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .responsive-grid {
      display: grid;
      gap: 0.5rem;
      width: 100%;
      height: 100%;
      grid-template-columns: 1fr;
      grid-template-rows: repeat(6, minmax(0, 1fr));
    }
    @media (min-width: 768px) {
      .responsive-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(4, minmax(0, 1fr));
        grid-auto-flow: column;
      }
    }
  </style>
</head>
<body>
  <div class="h-screen w-full bg-gray-100 p-4">
    <div class="responsive-grid">
      <div class="bg-yellow-400">G1</div>
      <div class="bg-yellow-400">G2</div>
      <div class="bg-yellow-400">G3</div>
      <div class="bg-yellow-400">G4</div>
      <div class="bg-gray-400">S1</div>
      <div class="bg-gray-400">S2</div>
    </div>
  </div>
</body>
</html>
